# M6/M7 消融训练配置（SPEC §5, A12；Table 1 的六种 loss 组合）。
#
# 说明：
# - 论文未给出 lr / batch / steps / α_i 等超参；下列数值是复现选择（A12），
#   必须原样写入结果 JSON，且不得当作论文值引用。
# - 论文协议：OpenOrca 15% 训练（D2 降规模为 max_examples 子集）、Llama 3.2 1B Instruct。
# - SGT 结构见 SPEC A1；`ffn_mult` 是 SGTModel 的 FFN 倍数，`max_len` 为 SGT 支持的最大长度
#   （数据 train.max_len=128，SGT 留出余量）。
model: unsloth/Llama-3.2-1B-Instruct
d: 2048

sgt:
  hidden: 512
  n_layers: 2
  n_heads: 4
  ffn_mult: 4
  max_len: 256
  sigma_init: 1.0

train:
  steps: 300
  # 注意：PyYAML 把 `1e-4` 解析成字符串，写成 `1.0e-4` 才是 float（数值相同）。
  lr: 1.0e-4
  batch_size: 2
  max_len: 128
  seed: 0
  grad_clip: 1.0

data:
  dataset: Open-Orca/OpenOrca
  frac: 0.15
  max_examples: 4000

# Table 1 的六种消融（loss 项子集取自 {"mi","acs","mnp","cge","bcs"}；α 默认 1.0）
variants:
  comp_entropy: {loss_terms: [cge]}
  cossim: {loss_terms: [bcs]}
  abscos: {loss_terms: [acs]}
  mi: {loss_terms: [mi]}
  mi_abscos: {loss_terms: [mi, acs]}
  mi_abscos_norm: {loss_terms: [mi, acs, mnp]}
