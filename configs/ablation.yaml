# M6/M7 消融训练配置（SPEC §5, A12；Table 1 的六种 loss 组合）。
#
# 说明：
# - 论文未给出 lr / batch / steps / α_i 等超参；下列数值是复现选择（A12），
#   必须原样写入结果 JSON，且不得当作论文值引用。
# - 论文协议：OpenOrca 15% 训练（D2 降规模为 max_examples 子集）、Llama 3.2 1B Instruct。
# - SGT 结构见 SPEC A1；`ffn_mult` 是 SGTModel 的 FFN 倍数，`max_len` 为 SGT 支持的最大长度
#   （数据 train.max_len=128，SGT 留出余量）。
model: unsloth/Llama-3.2-1B-Instruct
d: 2048

sgt:
  hidden: 512
  n_layers: 2
  n_heads: 4
  ffn_mult: 4
  # 与 train.max_len 一致：可学习位置编码只在训练长度内被训练，
  # 评测 prompt 超过该长度时 SGT 无定义（M8 会显式报错而不是静默外推）。
  max_len: 256
  sigma_init: 1.0

train:
  steps: 250
  # 注意：PyYAML 把 `1e-4` 解析成字符串，写成 `1.0e-4` 才是 float（数值相同）。
  lr: 1.0e-4
  # B=1、T=256：在 16GB 机器上训练显存可控（T=384 会触发 swap，实测拖慢到 >10min/变体）。
  # 论文未给 batch/长度（A12）；代价是 SGT 只对 ≤256 token 的序列有定义，
  # Utility 评测因此只覆盖 prompt 长度在 256 以内的任务（HellaSwag 10-shot 判 BLOCKED）。
  batch_size: 1
  max_len: 256
  seed: 0
  grad_clip: 1.0

data:
  dataset: Open-Orca/OpenOrca
  frac: 0.15
  max_examples: 4000

# Table 1 的六种消融（loss 项子集取自 {"mi","acs","mnp","cge","bcs"}）。
# alphas：Eq (11) 的 α1..α3。论文只给 α_i ∈ R+（A12）；这里取 α1 = 1/d = 4.8828125e-4，
# 即 MI 损失按特征维平均（与论文把 MI 报成 “feature level” 的口径一致），
# 否则 Eq (8) 的 Σ_j 展开使 L_MI ~ O(d) ≫ L_U，优化会被 MI 采样噪声主导。
alphas:
  mi: 4.8828125e-4
  acs: 1.0
  mnp: 1.0
variants:
  comp_entropy: {loss_terms: [cge]}
  cossim: {loss_terms: [bcs]}
  abscos: {loss_terms: [acs]}
  mi: {loss_terms: [mi]}
  mi_abscos: {loss_terms: [mi, acs]}
  mi_abscos_norm: {loss_terms: [mi, acs, mnp]}
